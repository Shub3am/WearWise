version: "2"
sql:
  - engine: postgresql
    schema: ../../db/migrations
    queries: queries
    gen:
      go:
        package: store
        out: internal/store
        sql_package: pgx/v5
        overrides:
          - db_type: timestamptz
            go_type: time.Time
          - db_type: uuid
            go_type:
              import: github.com/google/uuid
              type: UUID
